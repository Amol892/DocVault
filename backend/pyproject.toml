[project]
name = "docvault-backend"
version = "0.1.0"
description = "DocVault API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "email-validator==2.3.0",
    "fastapi>=0.141.1",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-passlib==1.7.7.20260211",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated migration files are not linted or reformatted (their style comes from script.py.mako).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# asserts and throwaway credentials are normal in tests
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # passlib 1.7.4 reads argon2.__version__, which argon2-cffi has deprecated (harmless)
    "ignore:Accessing argon2.__version__:DeprecationWarning",
]
pythonpath = ["."]
